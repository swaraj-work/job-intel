<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<title>Sign in · JobIntel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 3l11 6.3v12.4L16 28 5 21.7V9.3z' fill='none' stroke='%232f5fe3' stroke-width='3.5' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;}
.login-tools{position:absolute;top:16px;right:16px}
.wrap{width:100%;max-width:420px}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:26px;font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--blue)}
.brand svg{width:34px;height:34px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 32px 28px;box-shadow:0 24px 60px #1d3a8a1a}
h1{margin:0 0 22px;font-size:28px;line-height:1.2;letter-spacing:-.025em;font-weight:700}
a.go{margin-top:16px;min-height:48px;border-radius:8px;color:var(--on-button);font:inherit;font-weight:600;text-decoration:none;background:var(--button);display:flex;align-items:center;justify-content:center}
a.go:hover{filter:brightness(1.1)}
a.go:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.err{color:var(--red);font-size:13px}
</style>
</head>
<body>
<div class="login-tools"><select class="appearance" id="appearance" aria-label="Appearance"><option value="system">System theme</option><option value="light">Light mode</option><option value="dark">Dark mode</option></select></div>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"><path d="M17 3l12.5 7.2v13.6L17 31 4.5 23.8V10.2z"/><path d="M22 14.5a5.5 5.5 0 1 0 0 5H17"/></svg>
    JobIntel
  </div>
  <main class="card">
    <h1>Sign in to JobIntel</h1>
    <p>Find engineering jobs and track applications in your own workspace.</p>
    <p class="err" id="err" role="alert" hidden></p>
    <a class="go" href="/auth/google">Continue with Google</a>
  </main>
</div>
<script>
const errors = {
  unavailable: 'Google sign-in is not configured on this deployment.',
  invalid: 'This sign-in attempt ended or expired. Start again.',
  failed: 'Google sign-in failed. Try again.'
};
const error = new URLSearchParams(location.search).get('error');
if (Object.hasOwn(errors, error)) {
  const message = document.getElementById('err');
  message.textContent = errors[error];
  message.hidden = false;
}
</script>
</body>
</html>
